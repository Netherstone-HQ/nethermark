version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch bumps land in one PR; majors still come one by one.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Types match the Node that CI runs (.node-version), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to the Playwright whose browsers the cloud sessions and the CI image have; bumped by hand.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
