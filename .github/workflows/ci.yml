name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: typecheck+tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # The browser image's tag follows the Playwright version the package uses.
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/nethermark/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' packages/nethermark/package.json)" >> "$GITHUB_OUTPUT"

  # The React package's tests, in Chromium, on each React major it supports.
  # Its playwright devDependency is the same version, so the image has its browser.
  react:
    name: React tests (${{ matrix.react }})
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @netherstone/nethermark-react test:browser
        env:
          REACT: ${{ matrix.react }}

  # The tests run in Playwright's image, which already has every browser and
  # the system libraries they need, so nothing is installed on each run.
  browser:
    name: Browser tests (${{ matrix.shard }}/2)
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    # Firefox won't start as root unless HOME is root's own.
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @netherstone/nethermark test:browser --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/nethermark/playwright-report/
          retention-days: 14
