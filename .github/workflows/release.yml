name: Release

# Publishes every package whose version isn't on npm yet, then pushes the
# release tags. Versions are bumped in a normal PR with `pnpm changeset version`.
# Stays off until the repository variable NPM_PUBLISH is "true". Publishing
# uses npm trusted publishing, so no token is stored.
on:
  push:
    branches: [main]

concurrency: release

jobs:
  publish:
    name: Publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm release
      - run: git push origin --tags
