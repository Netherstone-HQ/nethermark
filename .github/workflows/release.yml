name: Release

# Publishes every package whose version isn't on npm yet, pushes the release
# tags and makes a GitHub Release for each, with its CHANGELOG section and npm link.
# Versions are bumped in a normal PR with `pnpm changeset version`. Stays off
# until the repository variable NPM_PUBLISH is "true". Publishing uses npm
# trusted publishing. The NPM_TOKEN lines only cover the first publish of
# @netherstone/nethermark-react, which trusted publishing can't do; npm tries
# trusted publishing first and only falls back to the token for a package
# without a trusted publisher. They come out once that package has one.
on:
  push:
    branches: [main]

concurrency: release

jobs:
  publish:
    name: Publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      # changeset publish makes annotated tags, which need a tagger.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
      # pnpm publishes through npm with a packed tarball, which drops the
      # package's publishConfig.provenance, so npm gets it from the environment.
      - run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: git push origin --tags
      - run: node scripts/github-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
